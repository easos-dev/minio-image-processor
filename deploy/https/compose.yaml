# 部署准备：在目标 Linux 服务器执行，不在本机启动。
# 复用已存在的 MinIO 网络与数据卷，不重新部署/重启 MinIO。
name: image-processor-http
services:
  image-processor:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: image-processor:0.1.0
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=1g,mode=1777"]
    # 8GiB目标主机预留2GiB给MinIO、Nginx和系统；CPU由进程读取实际可用核数。
    mem_limit: 6g
    pids_limit: 128
    volumes:
      - ./generated/config.toml:/etc/image-processor/config.toml:ro
    networks: [storage]
    logging: &safe-logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  gateway:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports: ["443:443", "8443:8443"]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, /var/cache/nginx]
    volumes:
      - ./generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    networks: [storage]
    depends_on: [image-processor]
    logging: *safe-logs
  # 显式执行一次，创建专用私有桶和应用用户；不会随 up 自动运行。
  bootstrap:
    profiles: [setup]
    build:
      context: .
      dockerfile: Dockerfile.mc
    entrypoint: ["/bin/sh", "/setup/bootstrap.sh"]
    environment:
      BUCKET: ${BUCKET:?run prepare.py on the server first}
    volumes:
      - ./bootstrap.sh:/setup/bootstrap.sh:ro
      - ./generated:/setup/generated:ro
      - ./secrets:/setup/secrets:ro
      - ${MINIO_SECRETS_DIR:?set existing MinIO secrets directory}:/setup/minio-secrets:ro
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [storage]
    logging: *safe-logs
networks:
  storage:
    external: true
    name: ${MINIO_NETWORK:-image-processor-dev}
